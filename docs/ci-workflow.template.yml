# flick — arm64-only debug build.
#
# TEMPLATE. Move to .github/workflows/build-debug.yml once the V1 Gradle skeleton exists;
# running it before that just produces a red X on every push.
#
# Rules it encodes (see AGENTS.md):
#   - one APK, arm64-v8a only. Never all 8 ABI/flavour combos.
#   - gradle.properties must keep kotlin.daemon.jvmargs=-Xmx4096m -XX:+UseParallelGC
#   - no local builds, ever. This runner is the only place Gradle runs.

name: build-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build devDebug (arm64-v8a only)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDevDebug \
            -Plastchat.abi.splits=true \
            --no-parallel \
            --stacktrace

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: flick-arm64-v8a
          path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
